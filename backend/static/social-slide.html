<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>LatinFun · Single Slide</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { width: 1080px; height: 1080px; }
  .root {
    width: 1080px; height: 1080px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 900;
    position: relative;
    overflow: hidden;
  }
  .bg-dark {
    background: radial-gradient(ellipse at 30% 20%, #7a1230 0%, #0a0a0c 60%),
                radial-gradient(ellipse at 80% 90%, #1f0a30 0%, transparent 60%),
                #0a0a0c;
    width: 100%; height: 100%; position: relative;
    padding: 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .bg-dark::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(225,29,72,0.16) 0, transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(147,51,234,0.14) 0, transparent 40%);
    pointer-events: none;
  }
  .pulse-bg {
    background: radial-gradient(circle at 50% 50%, rgba(225,29,72,0.30) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(147,51,234,0.18) 0%, transparent 60%),
                #0a0a0c;
    width: 100%; height: 100%; position: relative;
    padding: 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .slide-content { position: relative; z-index: 2; }
  .logo-row { display: flex; align-items: center; gap: 18px; }
  .logo-row img { width: 70px; height: 70px; border-radius: 16px; }
  .logo-row .name { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
  .pink { color: #E11D48; }

  .cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .cover-tagline { color: #E11D48; font-size: 22px; letter-spacing: 6px; margin-bottom: 30px; font-weight: 900; }
  .cover-title { font-size: 130px; line-height: 0.92; letter-spacing: -3px; }
  .cover-sub { font-size: 32px; font-weight: 400; line-height: 1.3; margin-top: 30px; max-width: 90%; color: #d4d4d8; }

  .footer-cta { display: flex; align-items: center; justify-content: space-between; font-size: 24px; font-weight: 800; }
  .footer-cta .swipe { color: #E11D48; }
  .footer-cta .stores { font-size: 18px; color: rgba(255,255,255,0.7); }

  .big-emoji { font-size: 160px; margin-bottom: 30px; line-height: 1; }
  .slide-title-big { font-size: 100px; line-height: 1; letter-spacing: -2px; }
  .slide-sub-big { font-size: 30px; font-weight: 400; line-height: 1.4; margin-top: 26px; color: #d4d4d8; max-width: 95%; }
  .match-feature-tag { background: #E11D48; color: #fff; display: inline-block; padding: 12px 24px; border-radius: 999px; font-size: 22px; letter-spacing: 3px; font-weight: 900; margin-bottom: 30px; }

  .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; align-items: center; margin-top: 30px; }
  .feat-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 32px; }
  .feat-card .ico { font-size: 60px; margin-bottom: 14px; }
  .feat-card .t { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
  .feat-card .d { font-size: 18px; color: #d4d4d8; font-weight: 400; line-height: 1.3; }

  .boost-prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
  .boost-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); border-radius: 28px; padding: 36px 24px; text-align: center; }
  .boost-card.top { background: linear-gradient(160deg, rgba(225,29,72,0.20), rgba(147,51,234,0.10)); border-color: #E11D48; }
  .boost-card .dur { font-size: 18px; color: #71717A; letter-spacing: 2px; font-weight: 700; }
  .boost-card .pr { font-size: 56px; font-weight: 900; color: #E11D48; margin: 8px 0; line-height: 1; }
  .boost-card.top .pr { color: #fff; }

  .cta-final { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; flex: 1; }
  .cta-final .download-now { font-size: 50px; color: #E11D48; font-weight: 900; margin-bottom: 30px; letter-spacing: 4px; }
  .cta-final .main-cta { font-size: 110px; line-height: 0.95; letter-spacing: -2px; margin-bottom: 60px; }
  .cta-final .stores-row { display: flex; gap: 30px; justify-content: center; margin-top: 40px; }
  .cta-final .store-btn { background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.20); padding: 26px 50px; border-radius: 20px; font-size: 24px; font-weight: 800; color: #fff; display: inline-flex; align-items: center; gap: 14px; }
  .cta-final .store-btn .em { font-size: 36px; }
</style>
</head>
