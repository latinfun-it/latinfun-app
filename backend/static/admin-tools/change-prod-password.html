<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LatinFun - Cambio Password Admin</title>
<style>
  * { box-sizing: border-box; }
  body { background: linear-gradient(180deg, #0a0a0a, #1a0a1a); color: #fff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 0; padding: 24px; min-height: 100vh; }
  .container { max-width: 480px; margin: 40px auto; background: #1a1a1a; border-radius: 20px; padding: 32px; border: 1px solid #2a2a2a; }
  h1 { color: #ff4757; font-size: 24px; margin: 0 0 8px; }
  .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
  label { display: block; color: #ddd; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  input { width: 100%; background: #0d0d0d; color: #fff; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; font-size: 16px; outline: none; }
  input:focus { border-color: #ff4757; }
  button { width: 100%; background: #ff4757; color: white; border: none; border-radius: 10px; padding: 16px; font-size: 16px; font-weight: 800; margin-top: 24px; cursor: pointer; }
  button:hover { background: #ff2d44; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .status.ok { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; }
  .status.err { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; }
  .info { background: rgba(116, 185, 255, 0.12); color: #74b9ff; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  code { background: #000; padding: 2px 6px; border-radius: 4px; color: #ffd700; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <h1>🔒 LatinFun · Cambio Password Admin</h1>
  <p class="subtitle">Tool d'emergenza per cambiare la password admin in PRODUZIONE.</p>

  <div class="info">
    <strong>⚠️ ATTENZIONE:</strong> Questo cambierà la password dell'account <code>admin@latinfun.it</code> sul backend di PRODUZIONE.
  </div>

  <label>Password attuale (oggi è <code>admin123</code>)</label>
  <input type="password" id="oldPwd" placeholder="admin123" autocomplete="off">

  <label>Nuova password (min 8 caratteri)</label>
  <input type="password" id="newPwd" placeholder="LatinFun2026Mauro!" autocomplete="off">

  <label>Conferma nuova password</label>
  <input type="password" id="newPwd2" placeholder="Ripeti la nuova password" autocomplete="off">

  <button id="btn" onclick="changePassword()">🔐 Cambia Password</button>

  <div id="status" style="display:none;"></div>
</div>

<script>
const PROD_URL = "https://dj-italia-hub.emergent.host";

function show(msg, isError) {
  const el = document.getElementById("status");
  el.style.display = "block";
  el.className = "status " + (isError ? "err" : "ok");
  el.innerHTML = msg;
}

async function changePassword() {
  const oldPwd = document.getElementById("oldPwd").value.trim();
  const newPwd = document.getElementById("newPwd").value.trim();
  const newPwd2 = document.getElementById("newPwd2").value.trim();

  if (!oldPwd || !newPwd || !newPwd2) {
    show("❌ Compila tutti i campi", true); return;
  }
  if (newPwd.length < 8) {
    show("❌ La nuova password deve avere almeno 8 caratteri", true); return;
  }
  if (newPwd !== newPwd2) {
    show("❌ Le due password non corrispondono", true); return;
  }

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "⏳ Attendere...";

  try {
    // Step 1: login to get token
    show("🔑 Step 1/2: Login...", false);
    const loginRes = await fetch(PROD_URL + "/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email: "admin@latinfun.it", password: oldPwd})
    });
    if (!loginRes.ok) {
      const e = await loginRes.text();
      throw new Error("Login fallito (HTTP " + loginRes.status + "): " + e);
    }
    const loginData = await loginRes.json();
    const token = loginData.access_token;
    if (!token) throw new Error("Token non ricevuto");

    // Step 2: change password
    show("🔐 Step 2/2: Cambio password...", false);
    const cpRes = await fetch(PROD_URL + "/api/auth/change-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({current_password: oldPwd, new_password: newPwd})
    });
    if (!cpRes.ok) {
      const e = await cpRes.text();
      throw new Error("Cambio fallito (HTTP " + cpRes.status + "): " + e);
    }
    const cpData = await cpRes.json();

    // Step 3: verify new password works
    show("✅ Password cambiata! Verifica in corso...", false);
    const verifyRes = await fetch(PROD_URL + "/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email: "admin@latinfun.it", password: newPwd})
    });
    if (!verifyRes.ok) {
      throw new Error("Cambio fatto ma login con nuova password fallisce");
    }

    show(
      "🎉 <strong>SUCCESSO!</strong><br><br>" +
      "✅ Password admin aggiornata in PRODUZIONE!<br>" +
      "✅ Login con nuova password verificato!<br><br>" +
      "⚠️ <strong>Salva la tua nuova password in un posto sicuro</strong> " +
      "(1Password / Bitwarden / Note iPhone).<br><br>" +
      "Da ora in poi le vecchie credenziali <code>admin123</code> " +
      "<strong>NON funzionano più</strong>. 🛡️",
      false
    );
    document.getElementById("oldPwd").value = "";
    document.getElementById("newPwd").value = "";
    document.getElementById("newPwd2").value = "";
    btn.textContent = "✅ FATTO";
  } catch (e) {
    show("❌ <strong>Errore:</strong> " + (e.message || e), true);
    btn.disabled = false;
    btn.textContent = "🔐 Riprova";
  }
}
</script>
</body>
</html>
